<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Town Simulator</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================
       COLOR PALETTE & DYNAMIC STYLES
       ========================================== */
    :root {
      /* Light Mode */
      --bg-color: #f6efdf;
      --card-bg: #fffbf0;
      --card-border: #7c5c43;
      --text-color: #5c4033;
      --accent-yellow: #f8c057;
      --accent-green: #90b078;
      --accent-hover: #e5b04c;
      --modal-overlay: rgba(92, 64, 51, 0.4);
      --path-color: #e8d8c0;
      --bamboo-color: #c19a6b;
      --bamboo-dark: #8c683c;
      --bamboo-leaf: #d2b48c;
      --hill-color: #d8c3a5;
    }

    [data-theme="dark"] {
      /* Dark Mode */
      --bg-color: #2b2420;
      --card-bg: #3d3531;
      --card-border: #8c6d56;
      --text-color: #eadbc8;
      --accent-yellow: #d49f37;
      --accent-green: #688352;
      --accent-hover: #ba8a2d;
      --modal-overlay: rgba(0, 0, 0, 0.6);
      --path-color: #4a3e37;
      --bamboo-color: #a67c4e;
      --bamboo-dark: #6e4e2e;
      --bamboo-leaf: #b8976d;
      --hill-color: #382f2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .app-container {
      width: 100%;
      max-width: 450px;
      height: 90vh;
      max-height: 850px;
      background-color: var(--card-bg);
      border: 4px solid var(--card-border);
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    }

    /* Header Bar */
    .header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(255, 255, 255, 0.2);
      border-bottom: 3px solid var(--card-border);
      z-index: 10;
    }

    .currency-container {
      display: flex;
      gap: 12px;
    }

    .currency-badge {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 2px 0 var(--card-border);
    }

    .btn-icon {
      background: var(--accent-yellow);
      border: 2px solid var(--card-border);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 0 var(--card-border);
      transition: transform 0.1s;
    }

    .btn-icon:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--card-border);
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      border-bottom: 3px solid var(--card-border);
      background-color: rgba(0, 0, 0, 0.03);
      z-index: 10;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: none;
      font-weight: 700;
      color: var(--text-color);
      cursor: pointer;
      border-right: 2px solid var(--card-border);
      opacity: 0.6;
      transition: all 0.2s;
    }

    .tab-btn:last-child {
      border-right: none;
    }

    .tab-btn.active {
      opacity: 1;
      background-color: var(--accent-yellow);
    }

    /* Main Viewport */
    .content-viewport {
      flex: 1;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .tab-content {
      display: none;
      height: 100%;
      position: relative;
    }

    .tab-content.active {
      display: block;
    }

    /* Cartoon Town Background (Home Page) */
    .town-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
    }

    .hill {
      position: absolute;
      background-color: var(--hill-color);
      border-radius: 50%;
      border: 3px solid var(--card-border);
    }

    .hill-1 {
      width: 300px;
      height: 200px;
      top: -50px;
      left: -50px;
    }

    .hill-2 {
      width: 350px;
      height: 250px;
      top: -80px;
      right: -80px;
    }

    .path {
      position: absolute;
      background-color: var(--path-color);
      width: 90px;
      height: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-left: 3px dashed var(--card-border);
      border-right: 3px dashed var(--card-border);
    }

    /* Outlined Facilities (No Bottom Background Shape) */
    .town-layout {
      position: relative;
      z-index: 2;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 35px;
      align-items: center;
    }

    .facility-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .outlined-art {
      filter: drop-shadow(0px 2px 0px var(--card-border));
      transition: transform 0.2s ease;
    }

    .facility-node:hover .outlined-art {
      transform: scale(1.04);
    }

    .facility-label {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      padding: 2px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-top: 4px;
      box-shadow: 0 2px 0 var(--card-border);
    }

    /* Construction Section */
    .construction-view {
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: space-between;
    }

    .construction-card {
      background: var(--card-bg);
      border: 3px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 0 var(--card-border);
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 18px;
      background: rgba(0,0,0,0.08);
      border: 2px solid var(--card-border);
      border-radius: 10px;
      margin: 15px 0;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent-green);
      width: 25%;
      transition: width 0.4s ease;
    }

    .btn-action {
      background: var(--accent-yellow);
      border: 3px solid var(--card-border);
      border-radius: 20px;
      padding: 12px 24px;
      font-weight: 700;
      font-size: 1rem;
      color: var(--text-color);
      cursor: pointer;
      box-shadow: 0 4px 0 var(--card-border);
      transition: all 0.1s;
      margin-bottom: 20px;
    }

    .btn-action:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--card-border);
    }

    /* Menu Section */
    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      padding: 15px;
    }

    .menu-item {
      background: var(--card-bg);
      border: 3px solid var(--card-border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 3px 0 var(--card-border);
    }

    /* Modal / Settings Overlay */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--modal-overlay);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      border: 4px solid var(--card-border);
      border-radius: 24px;
      width: 85%;
      padding: 20px;
      box-shadow: 0 8px 0 rgba(0,0,0,0.2);
      position: relative;
    }

    .modal-title {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 15px;
      border-bottom: 2px dashed var(--card-border);
      padding-bottom: 8px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .mode-toggle-group {
      display: flex;
      background: rgba(0,0,0,0.05);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      padding: 2px;
    }

    .mode-btn {
      border: none;
      background: none;
      padding: 6px 12px;
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-color);
    }

    .mode-btn.active {
      background: var(--accent-yellow);
      border: 1.5px solid var(--card-border);
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-color);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Top Bar -->
    <header class="header">
      <div class="currency-container">
        <div class="currency-badge">💰 <span>12,500</span></div>
        <div class="currency-badge">⭐ <span>850</span></div>
      </div>
      <button class="btn-icon" id="open-settings-btn" title="Settings">⚙️</button>
    </header>

    <!-- Navigation Bar -->
    <nav class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('home-tab', this)">Home (Town)</button>
      <button class="tab-btn" onclick="switchTab('construction-tab', this)">Construction</button>
      <button class="tab-btn" onclick="switchTab('menu-tab', this)">Facilities</button>
    </nav>

    <!-- Content Viewport -->
    <main class="content-viewport">

      <!-- HOME PAGE: Cartoon Town Background & Outlined Items -->
      <section id="home-tab" class="tab-content active">
        <div class="town-bg">
          <div class="hill hill-1"></div>
          <div class="hill hill-2"></div>
          <div class="path"></div>
        </div>

        <div class="town-layout">
          
          <!-- Light Brown Bamboo Feature -->
          <div class="facility-node">
            <svg class="outlined-art" width="90" height="90" viewBox="0 0 100 100">
              <rect x="25" y="20" width="10" height="65" rx="3" fill="var(--bamboo-color)" stroke="var(--card-border)" stroke-width="3"/>
              <line x1="25" y1="40" x2="35" y2="40" stroke="var(--card-border)" stroke-width="3"/>
              <line x1="25" y1="60" x2="35" y2="60" stroke="var(--card-border)" stroke-width="3"/>
              
              <rect x="45" y="10" width="12" height="75" rx="3" fill="var(--bamboo-color)" stroke="var(--card-border)" stroke-width="3"/>
              <line x1="45" y1="30" x2="57" y2="30" stroke="var(--card-border)" stroke-width="3"/>
              <line x1="45" y1="55" x2="57" y2="55" stroke="var(--card-border)" stroke-width="3"/>

              <rect x="67" y="30" width="9" height="55" rx="3" fill="var(--bamboo-dark)" stroke="var(--card-border)" stroke-width="3"/>
              
              <path d="M 20 25 C 10 20, 5 30, 20 30 Z" fill="var(--bamboo-leaf)" stroke="var(--card-border)" stroke-width="2"/>
              <path d="M 57 20 C 70 15, 75 25, 57 28 Z" fill="var(--bamboo-leaf)" stroke="var(--card-border)" stroke-width="2"/>
              <path d="M 45 45 C 30 40, 25 50, 45 50 Z" fill="var(--bamboo-leaf)" stroke="var(--card-border)" stroke-width="2"/>
            </svg>
            <div class="facility-label">Light Brown Bamboo</div>
          </div>

          <!-- Outlined Town Structure (No extra background pad at bottom) -->
          <div class="facility-node">
            <svg class="outlined-art" width="110" height="90" viewBox="0 0 120 100">
              <path d="M 10 40 L 60 10 L 110 40 Z" fill="#e88d72" stroke="var(--card-border)" stroke-width="3.5" stroke-linejoin="round"/>
              <line x1="25" y1="40" x2="25" y2="85" stroke="var(--card-border)" stroke-width="3.5"/>
              <line x1="95" y1="40" x2="95" y2="85" stroke="var(--card-border)" stroke-width="3.5"/>
              <rect x="20" y="55" width="80" height="30" rx="5" fill="#f8c057" stroke="var(--card-border)" stroke-width="3.5"/>
            </svg>
            <div class="facility-label">Town Kiosk</div>
          </div>

          <!-- Outlined Bench Structure -->
          <div class="facility-node">
            <svg class="outlined-art" width="100" height="70" viewBox="0 0 100 70">
              <path d="M 15 30 Q 50 10 85 30 Z" fill="#78a0d0" stroke="var(--card-border)" stroke-width="3"/>
              <line x1="50" y1="30" x2="50" y2="65" stroke="var(--card-border)" stroke-width="3"/>
              <ellipse cx="50" cy="55" rx="25" ry="8" fill="#f6efdf" stroke="var(--card-border)" stroke-width="3"/>
            </svg>
            <div class="facility-label">Rest Area</div>
          </div>

        </div>
      </section>

      <!-- CONSTRUCTION PAGE (Updates on 'Update Display' button click) -->
      <section id="construction-tab" class="tab-content">
        <div class="construction-view">
          
          <div class="construction-card">
            <h3 style="font-weight: 700; margin-bottom: 6px;">Town Construction</h3>
            <p style="font-size: 0.85rem; opacity: 0.8;">Current Stage: <span id="status-phase-text" style="font-weight: 700;">Stage 1 - Framing</span></p>

            <div style="margin: 25px 0;">
              <svg id="construction-svg" class="outlined-art" width="130" height="110" viewBox="0 0 120 100">
                <path d="M 20 90 L 20 20 L 80 20" fill="none" stroke="#e88d72" stroke-width="4" stroke-linecap="round"/>
                <line x1="20" y1="35" x2="35" y2="20" stroke="#e88d72" stroke-width="3"/>
                <line x1="70" y1="20" x2="70" y2="45" stroke="var(--card-border)" stroke-width="2" stroke-dasharray="3,3"/>
                <rect id="build-rect-1" x="45" y="60" width="50" height="30" fill="none" stroke="var(--card-border)" stroke-width="3.5" stroke-dasharray="4,4"/>
                <rect id="build-rect-2" x="55" y="40" width="30" height="20" fill="none" stroke="var(--card-border)" stroke-width="3" stroke-dasharray="3,3"/>
                <line x1="10" y1="90" x2="110" y2="90" stroke="var(--card-border)" stroke-width="3.5"/>
              </svg>
            </div>

            <div class="progress-bar-container">
              <div id="construction-progress" class="progress-bar-fill"></div>
            </div>
            <p id="progress-text" style="font-size: 0.85rem; font-weight: 700;">25% Progress</p>
          </div>

          <button class="btn-action" id="update-display-btn">Update Display</button>

        </div>
      </section>

      <!-- FACILITIES MENU PAGE -->
      <section id="menu-tab" class="tab-content">
        <div class="menu-grid">
          <div class="menu-item">
            <svg width="50" height="50" viewBox="0 0 60 60">
              <rect x="20" y="10" width="8" height="40" fill="var(--bamboo-color)" stroke="var(--card-border)" stroke-width="2"/>
              <rect x="32" y="5" width="8" height="45" fill="var(--bamboo-color)" stroke="var(--card-border)" stroke-width="2"/>
            </svg>
            <div style="font-weight: 700; font-size: 0.85rem; margin-top: 4px;">Light Bamboo</div>
          </div>
          <div class="menu-item">
            <svg width="50" height="50" viewBox="0 0 60 60">
              <rect x="10" y="25" width="40" height="20" fill="#f8c057" stroke="var(--card-border)" stroke-width="2"/>
            </svg>
            <div style="font-weight: 700; font-size: 0.85rem; margin-top: 4px;">Town Table</div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- SETTINGS MODAL (NO GRAPHICS OPTION, MODES OPTION ADDED) -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <button class="close-btn" id="close-settings-btn">&times;</button>
      <div class="modal-title">Settings</div>

      <div class="setting-row">
        <span>Modes</span>
        <div class="mode-toggle-group">
          <button class="mode-btn active" id="light-mode-btn" onclick="setTheme('light')">Light</button>
          <button class="mode-btn" id="dark-mode-btn" onclick="setTheme('dark')">Dark</button>
        </div>
      </div>

      <div class="setting-row">
        <span>Sound Effects</span>
        <input type="checkbox" checked style="accent-color: var(--accent-yellow); transform: scale(1.3);">
      </div>

      <div class="setting-row">
        <span>Background Music</span>
        <input type="checkbox" checked style="accent-color: var(--accent-yellow); transform: scale(1.3);">
      </div>

    </div>
  </div>

  <!-- SCRIPT LOGIC -->
  <script>
    // Tab Navigation
    function switchTab(tabId, btnElement) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      btnElement.classList.add('active');
    }

    // Settings Modal Toggle
    const settingsModal = document.getElementById('settings-modal');
    document.getElementById('open-settings-btn').addEventListener('click', () => {
      settingsModal.classList.add('active');
    });
    document.getElementById('close-settings-btn').addEventListener('click', () => {
      settingsModal.classList.remove('active');
    });

    // Dark/Light Mode Switcher
    function setTheme(mode) {
      const lightBtn = document.getElementById('light-mode-btn');
      const darkBtn = document.getElementById('dark-mode-btn');

      if (mode === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        darkBtn.classList.add('active');
        lightBtn.classList.remove('active');
      } else {
        document.documentElement.removeAttribute('data-theme');
        lightBtn.classList.add('active');
        darkBtn.classList.remove('active');
      }
    }

    // Construction Display Update Function
    let constructionStage = 0;
    const stages = [
      { percent: 25, title: "Stage 1 - Framing", fill1: "none", fill2: "none" },
      { percent: 55, title: "Stage 2 - Walls & Foundation", fill1: "#f8c057", fill2: "none" },
      { percent: 85, title: "Stage 3 - Exterior Finish", fill1: "#f8c057", fill2: "#e88d72" },
      { percent: 100, title: "Stage 4 - Construction Complete", fill1: "#90b078", fill2: "#f8c057" }
    ];

    document.getElementById('update-display-btn').addEventListener('click', () => {
      constructionStage = (constructionStage + 1) % stages.length;
      const current = stages[constructionStage];

      document.getElementById('construction-progress').style.width = current.percent + '%';
      document.getElementById('progress-text').innerText = current.percent + '% Progress';
      document.getElementById('status-phase-text').innerText = current.title;

      const rect1 = document.getElementById('build-rect-1');
      const rect2 = document.getElementById('build-rect-2');

      rect1.setAttribute('fill', current.fill1);
      rect2.setAttribute('fill', current.fill2);

      if (current.percent === 100) {
        rect1.removeAttribute('stroke-dasharray');
        rect2.removeAttribute('stroke-dasharray');
      } else {
        rect1.setAttribute('stroke-dasharray', '4,4');
        rect2.setAttribute('stroke-dasharray', '3,3');
      }
    });
  </script>
</body>
</html>
