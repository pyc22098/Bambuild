<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snake Party</title>
    <style>
        :root {
            --bg-color: #fdf8ed;
            --card-bg: #fffbf0;
            --border-color: #7c5c43;
            --text-color: #5a4033;
            --accent-color: #e29578;
            --accent-hover: #d87d5a;
            --grid-bg: #f4ece1;
            --snake-head: #e09f67;
            --snake-body: #f1b980;
            --food-color: #ff70a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            color: var(--border-color);
            margin-bottom: 5px;
            text-shadow: 1px 1px 0px #fff;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 3px 0 var(--border-color);
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: white;
        }

        .tab-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 var(--border-color);
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tab-content {
            width: 100%;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Animals List Grid */
        .animals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            width: 100%;
        }

        .animal-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 15px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 0 var(--border-color);
        }

        .animal-face {
            width: 70px;
            height: 70px;
            margin-bottom: 8px;
            position: relative;
        }

        .animal-name {
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--border-color);
        }

        /* Game Layout */
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 6px 0 var(--border-color);
            position: relative;
            width: 100%;
            max-width: 440px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--border-color);
        }

        #game-board {
            width: 300px;
            height: 300px;
            background-color: var(--grid-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            touch-action: none;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(253, 248, 237, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            z-index: 10;
            border-radius: 10px;
        }

        .overlay h2 {
            color: var(--border-color);
            margin-bottom: 10px;
        }

        .instructions {
            font-size: 0.9rem;
            margin-bottom: 15px;
            line-height: 1.4;
            color: var(--text-color);
            text-align: left;
        }

        .instructions ul {
            margin-left: 20px;
            margin-top: 5px;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: 2px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--border-color);
            transition: all 0.1s;
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 var(--border-color);
        }

        /* Controls */
        .controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .control-row {
            display: flex;
            gap: 5px;
        }

        .ctrl-btn {
            width: 45px;
            height: 45px;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px 0 var(--border-color);
            cursor: pointer;
        }

        .ctrl-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--border-color);
        }

        /* SVG Animal Styles */
        svg {
            width: 100%;
            height: 100%;
        }

        @media (min-width: 600px) {
            #game-board {
                width: 360px;
                height: 360px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Animal Restaurant</h1>
        <p style="color: #7c5c43; font-size: 0.9rem;">Cute Characters & Snake Game</p>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('animals')">50 Animals</button>
        <button class="tab-btn" onclick="switchTab('game')">Snake Game</button>
    </div>

    <div class="container">
        <!-- Animals List Tab -->
        <div id="animals-tab" class="tab-content active">
            <div class="animals-grid" id="animals-grid">
                <!-- Javascript will populate this -->
            </div>
        </div>

        <!-- Game Tab -->
        <div id="game-tab" class="tab-content">
            <div style="display: flex; justify-content: center;">
                <div class="game-wrapper">
                    <div class="game-header">
                        <span>Score: <span id="score">0</span></span>
                        <span>Best: <span id="high-score">0</span></span>
                    </div>

                    <div id="game-board">
                        <div id="instruction-overlay" class="overlay">
                            <h2>Snake Game</h2>
                            <div class="instructions">
                                <p><strong>How to Play:</strong></p>
                                <ul>
                                    <li>Use <strong>W, A, S, D</strong> or <strong>Arrow Keys</strong> on Keyboard</li>
                                    <li><strong>Swipe</strong> on the game screen</li>
                                    <li>Use the <strong>On-Screen Buttons</strong></li>
                                    <li>Avoid margins and hitting yourself!</li>
                                </ul>
                            </div>
                            <button class="btn" onclick="startGame()">Start Playing</button>
                        </div>

                        <div id="gameover-overlay" class="overlay" style="display: none;">
                            <h2 style="color: #d9534f;">Game Over!</h2>
                            <p style="margin-bottom: 15px;">Final Score: <span id="final-score">0</span></p>
                            <button class="btn" onclick="startGame()">Play Again</button>
                        </div>

                        <canvas id="canvas" width="360" height="360"></canvas>
                    </div>

                    <!-- On Screen Controls -->
                    <div class="controls">
                        <div class="control-row">
                            <button class="ctrl-btn" onclick="handleInput('UP')">▲</button>
                        </div>
                        <div class="control-row">
                            <button class="ctrl-btn" onclick="handleInput('LEFT')">◄</button>
                            <button class="ctrl-btn" onclick="handleInput('DOWN')">▼</button>
                            <button class="ctrl-btn" onclick="handleInput('RIGHT')">►</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 50 ANIMALS DATA & SVG GENERATOR ---
        const animalData = [
            { name: "Gumi (Cat)", bg: "#fcedc0", ears: "#e09f67", face: "#fcedc0", details: "cat" },
            { name: "Shiba Inu", bg: "#e09f67", ears: "#c67d43", face: "#fff5e4", details: "dog" },
            { name: "Rabbit", bg: "#ffffff", ears: "#f7aef8", face: "#ffffff", details: "bunny" },
            { name: "Bear", bg: "#a06cd5", ears: "#7d46b8", face: "#e2c0ff", details: "bear" },
            { name: "Panda", bg: "#ffffff", ears: "#333333", face: "#ffffff", details: "panda" },
            { name: "Frog", bg: "#b5e2fa", ears: "#b5e2fa", face: "#b5e2fa", details: "frog" },
            { name: "Pig", bg: "#ffc6ff", ears: "#ff9cee", face: "#ffc6ff", details: "pig" },
            { name: "Chick", bg: "#ffadad", ears: "#ffadad", face: "#ffadad", details: "chick" },
            { name: "Fox", bg: "#f77f00", ears: "#d62828", face: "#fcbf49", details: "fox" },
            { name: "Koala", bg: "#cad2c5", ears: "#84a98c", face: "#cad2c5", details: "koala" },
            { name: "Tiger", bg: "#f8961e", ears: "#f3722c", face: "#f9c74f", details: "tiger" },
            { name: "Penguin", bg: "#2b2d42", ears: "#2b2d42", face: "#edf2f4", details: "penguin" },
            { name: "Sloth", bg: "#e0c3fc", ears: "#8ecae6", face: "#f72585", details: "sloth" },
            { name: "Red Panda", bg: "#c1121f", ears: "#780000", face: "#fdf0d5", details: "redpanda" },
            { name: "Owl", bg: "#9a7b56", ears: "#6b4d2f", face: "#e6ccb2", details: "owl" },
            { name: "Hamster", bg: "#f4a261", ears: "#e76f51", face: "#e9c46a", details: "hamster" },
            { name: "Mouse", bg: "#d3d3d3", ears: "#ffb703", face: "#f8f9fa", details: "mouse" },
            { name: "Deer", bg: "#bb9457", ears: "#432818", face: "#ffe6a7", details: "deer" },
            { name: "Raccoon", bg: "#6c757d", ears: "#343a40", face: "#f8f9fa", details: "raccoon" },
            { name: "Monkey", bg: "#b08968", ears: "#7f5539", face: "#ede0d4", details: "monkey" },
            { name: "Sheep", bg: "#f8f9fa", ears: "#e9ecef", face: "#f8f9fa", details: "sheep" },
            { name: "Duck", bg: "#ffd166", ears: "#ffd166", face: "#ffd166", details: "duck" },
            { name: "Seal", bg: "#e0e1dd", ears: "#e0e1dd", face: "#e0e1dd", details: "seal" },
            { name: "Axolotl", bg: "#ffb5a7", ears: "#f8ad9d", face: "#fcd5ce", details: "axolotl" },
            { name: "Capybara", bg: "#9c6644", ears: "#7f5539", face: "#b08968", details: "capybara" },
            { name: "Hippo", bg: "#cdb4db", ears: "#ffc8dd", face: "#cdb4db", details: "hippo" },
            { name: "Elephant", bg: "#a2d2ff", ears: "#bde0fe", face: "#a2d2ff", details: "elephant" },
            { name: "Corgi", bg: "#dda15e", ears: "#bc6c25", face: "#fefae0", details: "corgi" },
            { name: "Calico Cat", bg: "#ffffff", ears: "#f4a261", face: "#ffffff", details: "calico" },
            { name: "Otter", bg: "#8d6e63", ears: "#5d4037", face: "#d7ccc8", details: "otter" },
            { name: "Hedgehog", bg: "#d7ccc8", ears: "#8d6e63", face: "#f5f5f5", details: "hedgehog" },
            { name: "Lion", bg: "#ffe082", ears: "#ffb300", face: "#ffe082", details: "lion" },
            { name: "Wolf", bg: "#cfd8dc", ears: "#90a4ae", face: "#eceff1", details: "wolf" },
            { name: "Alpaca", bg: "#ffffff", ears: "#f5f5f5", face: "#ffffff", details: "alpaca" },
            { name: "Cheetah", bg: "#ffe082", ears: "#ffb300", face: "#ffe082", details: "cheetah" },
            { name: "Beaver", bg: "#a1887f", ears: "#6d4c41", face: "#d7ccc8", details: "beaver" },
            { name: "Squirrel", bg: "#ffb74d", ears: "#f57c00", face: "#ffe0b2", details: "squirrel" },
            { name: "Giraffe", bg: "#ffe082", ears: "#ffb300", face: "#ffe082", details: "giraffe" },
            { name: "Bat", bg: "#b0bec5", ears: "#78909c", face: "#eceff1", details: "bat" },
            { name: "Whale", bg: "#81d4fa", ears: "#81d4fa", face: "#e1f5fe", details: "whale" },
            { name: "Shiba Black", bg: "#424242", ears: "#212121", face: "#e0e0e0", details: "shibablack" },
            { name: "Cow", bg: "#ffffff", ears: "#e0e0e0", face: "#ffffff", details: "cow" },
            { name: "Husky", bg: "#90a4ae", ears: "#546e7a", face: "#ffffff", details: "husky" },
            { name: "Bee", bg: "#fff176", ears: "#fff176", face: "#fff176", details: "bee" },
            { name: "Dragon", bg: "#c8e6c9", ears: "#81c784", face: "#e8f5e9", details: "dragon" },
            { name: "Parrot", bg: "#81c784", ears: "#81c784", face: "#e8f5e9", details: "parrot" },
            { name: "Crow", bg: "#616161", ears: "#424242", face: "#757575", details: "crow" },
            { name: "Chinchilla", bg: "#e0e0e0", ears: "#bdbdbd", face: "#f5f5f5", details: "chinchilla" },
            { name: "Platypus", bg: "#80deea", ears: "#4dd0e1", face: "#e0f7fa", details: "platypus" },
            { name: "Walrus", bg: "#bcaaa4", ears: "#8d6e63", face: "#d7ccc8", details: "walrus" }
        ];

        function createAnimalSVG(animal) {
            // Animal Restaurant Style: Soft shapes, dark outlines (#5a4033), pink cheeks, minimalist dot eyes
            return `
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Base Head -->
                <circle cx="50" cy="55" r="35" fill="${animal.bg}" stroke="#5a4033" stroke-width="3" />
                
                <!-- Ears/Ears details -->
                <circle cx="25" cy="25" r="10" fill="${animal.ears}" stroke="#5a4033" stroke-width="3" />
                <circle cx="75" cy="25" r="10" fill="${animal.ears}" stroke="#5a4033" stroke-width="3" />
                
                <!-- Inner face overlay if needed -->
                <ellipse cx="50" cy="60" rx="25" ry="20" fill="${animal.face}" />

                <!-- Cheeks -->
                <circle cx="30" cy="62" r="5" fill="#ffb3ba" opacity="0.7" />
                <circle cx="70" cy="62" r="5" fill="#ffb3ba" opacity="0.7" />

                <!-- Eyes -->
                <circle cx="38" cy="52" r="3" fill="#5a4033" />
                <circle cx="62" cy="52" r="3" fill="#5a4033" />
                
                <!-- Nose/Mouth -->
                <ellipse cx="50" cy="58" rx="2.5" ry="2" fill="#5a4033" />
                <path d="M 47 62 Q 50 65 53 62" fill="none" stroke="#5a4033" stroke-width="2" stroke-linecap="round" />
            </svg>
            `;
        }

        function renderAnimals() {
            const grid = document.getElementById('animals-grid');
            grid.innerHTML = '';
            animalData.forEach(animal => {
                const card = document.createElement('div');
                card.className = 'animal-card';
                card.innerHTML = `
                    <div class="animal-face">${createAnimalSVG(animal)}</div>
                    <div class="animal-name">${animal.name}</div>
                `;
                grid.appendChild(card);
            });
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if(tab === 'animals') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('animals-tab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('game-tab').classList.add('active');
            }
        }

        // --- SNAKE GAME LOGIC ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const gridSize = 18;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = gridSize;
        let dy = 0;
        let score = 0;
        let highScore = 0;
        let gameInterval = null;
        let isGameRunning = false;

        // Touch handling variables
        let touchStartX = 0;
        let touchStartY = 0;

        function initGame() {
            snake = [
                { x: 5 * gridSize, y: 10 * gridSize },
                { x: 4 * gridSize, y: 10 * gridSize },
                { x: 3 * gridSize, y: 10 * gridSize }
            ];
            dx = gridSize;
            dy = 0;
            score = 0;
            document.getElementById('score').innerText = score;
            spawnFood();
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCount) * gridSize;
            food.y = Math.floor(Math.random() * tileCount) * gridSize;
            // Ensure food doesn't spawn on snake
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) spawnFood();
            });
        }

        function startGame() {
            document.getElementById('instruction-overlay').style.display = 'none';
            document.getElementById('gameover-overlay').style.display = 'none';
            initGame();
            isGameRunning = true;
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 120);
        }

        function gameOver() {
            isGameRunning = false;
            clearInterval(gameInterval);
            document.getElementById('final-score').innerText = score;
            if (score > highScore) {
                highScore = score;
                document.getElementById('high-score').innerText = highScore;
            }
            document.getElementById('gameover-overlay').style.display = 'flex';
        }

        function gameLoop() {
            update();
            draw();
        }

        function update() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall Collision Check
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                gameOver();
                return;
            }

            // Self Collision Check
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Food Collision Check
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').innerText = score;
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function draw() {
            // Background
            ctx.fillStyle = '#f4ece1';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Food (Styled as a small treat/fish shape)
            ctx.fillStyle = '#ff70a6';
            ctx.beginPath();
            ctx.arc(food.x + gridSize / 2, food.y + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#5a4033';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Draw Snake
            snake.forEach((part, index) => {
                if (index === 0) {
                    // Head - Cute Animal Face Style
                    ctx.fillStyle = '#e09f67';
                    ctx.beginPath();
                    ctx.roundRect(part.x, part.y, gridSize, gridSize, [6]);
                    ctx.fill();
                    ctx.strokeStyle = '#5a4033';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Eyes
                    ctx.fillStyle = '#5a4033';
                    ctx.beginPath();
                    ctx.arc(part.x + 5, part.y + 6, 1.5, 0, Math.PI * 2);
                    ctx.arc(part.x + 13, part.y + 6, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Body
                    ctx.fillStyle = '#f1b980';
                    ctx.beginPath();
                    ctx.roundRect(part.x + 1, part.y + 1, gridSize - 2, gridSize - 2, [4]);
                    ctx.fill();
                    ctx.strokeStyle = '#7c5c43';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            });
        }

        function handleInput(dir) {
            if (!isGameRunning) return;
            if (dir === 'UP' && dy === 0) { dx = 0; dy = -gridSize; }
            if (dir === 'DOWN' && dy === 0) { dx = 0; dy = gridSize; }
            if (dir === 'LEFT' && dx === 0) { dx = -gridSize; dy = 0; }
            if (dir === 'RIGHT' && dx === 0) { dx = gridSize; dy = 0; }
        }

        // Keyboard Controls
        window.addEventListener('keydown', e => {
            switch (e.key.toLowerCase()) {
                case 'w':
                case 'arrowup':
                    handleInput('UP');
                    break;
                case 's':
                case 'arrowdown':
                    handleInput('DOWN');
                    break;
                case 'a':
                case 'arrowleft':
                    handleInput('LEFT');
                    break;
                case 'd':
                case 'arrowright':
                    handleInput('RIGHT');
                    break;
            }
        });

        // Touch & Swipe Controls
        const board = document.getElementById('game-board');

        board.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        board.addEventListener('touchend', e => {
            if (!touchStartX || !touchStartY) return;

            let touchEndX = e.changedTouches[0].clientX;
            let touchEndY = e.changedTouches[0].clientY;

            let diffX = touchEndX - touchStartX;
            let diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                // Horizontal Swipe
                if (diffX > 20) handleInput('RIGHT');
                else if (diffX < -20) handleInput('LEFT');
            } else {
                // Vertical Swipe
                if (diffY > 20) handleInput('DOWN');
                else if (diffY < -20) handleInput('UP');
            }

            touchStartX = 0;
            touchStartY = 0;
        }, { passive: true });

        // On Load
        renderAnimals();
        draw();
    </script>
</body>
</html>
