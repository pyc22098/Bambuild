<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAMBUILD - 2D Animal Town Builder</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;900&family=Mochiy+Pop+One&display=swap" rel="stylesheet">

  <style>
    /* --- COLOR PALETTE & DYNAMIC STYLES --- */
    :root {
      /* Light Mode Palette */
      --bg-color: #f6efdf;
      --card-bg: #fffbf0;
      --card-border: #7c5c43;
      --text-color: #5c4033;
      --accent-yellow: #f8c057;
      --accent-green: #90b078;
      --accent-hover: #e5b04c;
      --accent-red: #e88d72;
      --accent-blue: #78a0d0;
      --modal-overlay: rgba(92, 64, 51, 0.4);
      --path-color: #d1c4b2;
      --bamboo-color: #c19a6b;
      --bamboo-dark: #8c683c;
      --bamboo-leaf: #d2b48c;
      --hill-color: #d8c3a5;
    }

    [data-theme="dark"] {
      /* Dark Mode Palette */
      --bg-color: #2b2420;
      --card-bg: #3d3531;
      --card-border: #8c6d56;
      --text-color: #eadbc8;
      --accent-yellow: #d49f37;
      --accent-green: #688352;
      --accent-hover: #ba8a2d;
      --accent-red: #c06348;
      --accent-blue: #55739a;
      --modal-overlay: rgba(0, 0, 0, 0.6);
      --path-color: #3b322c;
      --bamboo-color: #a67c4e;
      --bamboo-dark: #6e4e2e;
      --bamboo-leaf: #b8976d;
      --hill-color: #382f2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Quicksand', sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Standard Town-Simulator Button Style */
    .btn {
      cursor: pointer;
      border: 3px solid var(--card-border);
      border-radius: 20px;
      padding: 10px 20px;
      font-weight: 700;
      font-size: 1rem;
      background-color: var(--accent-yellow);
      color: var(--text-color);
      box-shadow: 0 4px 0 var(--card-border);
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      z-index: 10;
    }

    .btn:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--card-border);
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--card-border);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: 0 4px 0 var(--card-border) !important;
    }

    /* Custom OK Button */
    .btn-ok {
      background-color: var(--accent-yellow);
      color: var(--text-color);
      font-weight: 900;
      font-size: 1.1rem;
      padding: 10px 28px;
      border: 3px solid var(--card-border);
      border-radius: 20px;
      box-shadow: 0 4px 0 var(--card-border);
      cursor: pointer;
      display: inline-block;
      text-align: center;
      transition: transform 0.1s, box-shadow 0.1s, background-color 0.2s;
    }
    .btn-ok:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--card-border);
    }
    .btn-ok:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--card-border);
    }

    .btn-icon {
      background: var(--accent-yellow);
      border: 2px solid var(--card-border);
      border-radius: 50%;
      width: 42px;
      height: 42px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 0 var(--card-border);
      transition: transform 0.1s;
      color: var(--text-color);
      font-weight: 700;
    }

    .btn-icon:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--card-border);
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--modal-overlay);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(3px);
    }

    .modal-card {
      background: var(--card-bg);
      border: 4px solid var(--card-border);
      border-radius: 24px;
      width: 90%;
      max-width: 520px;
      padding: 24px;
      position: relative;
      box-shadow: 0 8px 0 rgba(0,0,0,0.15);
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-title {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 15px;
      border-bottom: 2px dashed var(--card-border);
      padding-bottom: 8px;
    }

    .modal-close {
      position: absolute;
      top: 10px; right: 14px;
      font-size: 24px;
      cursor: pointer;
      color: var(--text-color);
      font-weight: 700;
      background: none;
      border: none;
      transition: transform 0.1s ease;
    }
    .modal-close:hover {
      transform: scale(1.2);
    }

    /* Form Selects & Inputs */
    .modal-select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 12px;
      border: 2px solid var(--card-border);
      font-size: 0.95rem;
      font-weight: 700;
      background: var(--card-bg);
      color: var(--text-color);
    }

    /* Mode Toggles */
    .setting-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 18px;
      font-weight: 600;
    }

    .setting-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .volume-slider {
      width: 100%;
      accent-color: var(--accent-yellow);
      cursor: pointer;
      height: 8px;
    }

    .mode-toggle-group {
      display: flex;
      background: rgba(0,0,0,0.05);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      padding: 2px;
    }

    .mode-btn {
      border: none;
      background: none;
      padding: 6px 12px;
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-color);
    }

    .mode-btn.active {
      background: var(--accent-yellow);
      border: 1.5px solid var(--card-border);
    }

    /* --- HOME SCREEN --- */
    #home-screen {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-color);
      z-index: 1;
      overflow: hidden;
    }

    /* Cartoon Town Background Elements */
    .town-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      overflow: hidden;
      pointer-events: none;
    }

    .hill {
      position: absolute;
      background-color: var(--hill-color);
      border-radius: 50%;
      border: 3px solid var(--card-border);
    }

    .hill-1 { width: 400px; height: 250px; top: -80px; left: -100px; }
    .hill-2 { width: 450px; height: 300px; top: -100px; right: -120px; }
    .path {
      position: absolute;
      background-color: var(--path-color);
      width: 120px;
      height: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-left: 3px dashed var(--card-border);
      border-right: 3px dashed var(--card-border);
    }

    /* Corner Buttons */
    .top-left-btn { position: absolute; top: 20px; left: 20px; background-color: var(--accent-yellow); }
    .top-right-btn { position: absolute; top: 20px; right: 20px; background-color: var(--accent-green); color: #fff; }
    .bottom-left-btn { position: absolute; bottom: 20px; left: 20px; background-color: var(--accent-blue); color: #fff; }
    .bottom-right-btn { position: absolute; bottom: 20px; right: 20px; background-color: var(--accent-red); color: #fff; }

    /* Title Container */
    .title-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 40px;
      z-index: 5;
    }

    .bamboo-art {
      filter: drop-shadow(0px 2px 0px var(--card-border));
      display: inline-block;
      vertical-align: middle;
    }

    .title-text {
      font-size: 56px;
      font-weight: 900;
      color: var(--text-color);
      letter-spacing: 4px;
      text-shadow: 3px 3px 0px var(--card-bg), 6px 6px 0px var(--card-border);
      font-family: 'Mochiy Pop One', cursive;
    }

    /* Middle Center Buttons */
    .home-center-buttons {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 320px;
      z-index: 5;
    }

    .circle-btn {
      border-radius: 50%;
      border: 3.5px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--card-border);
      transition: transform 0.1s, box-shadow 0.1s;
      position: relative;
      background: var(--card-bg);
    }

    .circle-btn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 6px 0 var(--card-border);
    }

    .circle-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--card-border);
    }

    .circle-btn.bear { 
      background-color: var(--bamboo-color); 
      width: 75px; 
      height: 75px; 
    }

    .circle-btn.start { 
      background-color: var(--accent-red); 
      width: 95px; 
      height: 95px; 
    }

    .circle-btn.character { 
      background-color: var(--accent-blue); 
      width: 75px; 
      height: 75px; 
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    .pulse-icon {
      animation: pulse 1.6s infinite ease-in-out;
    }

    /* --- TOWN SCREEN & PAVEMENT CANVAS --- */
    #town-screen {
      position: absolute;
      width: 100%;
      height: 100%;
      display: none;
      background: var(--bg-color);
      z-index: 2;
    }

    .town-viewport {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    /* Pavement Town Map Grid */
    .town-map-area {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 85%;
      background-color: var(--path-color);
      background-image: 
        linear-gradient(var(--card-border) 1px, transparent 1px),
        linear-gradient(90deg, var(--card-border) 1px, transparent 1px);
      background-size: 50px 50px;
      border-top: 4px solid var(--card-border);
    }

    /* Distant Short Buildings Background Row */
    .short-buildings-row {
      position: absolute;
      top: -45px;
      left: 0;
      width: 100%;
      height: 45px;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      pointer-events: none;
      z-index: 1;
    }

    .town-header {
      position: absolute;
      top: 12px; left: 16px; right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
    }

    /* Player Profile Area & Clock Tag */
    .player-profile-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      border: 3px solid var(--card-border);
      padding: 4px 12px 4px 6px;
      border-radius: 25px;
      box-shadow: 0 4px 0 var(--card-border);
    }

    .player-avatar-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent-yellow);
      border: 2px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 2px 0 var(--card-border);
    }

    .player-info-text {
      display: flex;
      flex-direction: column;
    }

    .player-name {
      font-weight: 800;
      font-size: 0.95rem;
      line-height: 1.1;
      color: var(--text-color);
    }

    .player-status-tag {
      font-size: 0.72rem;
      font-weight: 700;
      color: #666;
    }

    .resources-bar {
      display: flex;
      gap: 14px;
      background: var(--card-bg);
      padding: 6px 16px;
      border-radius: 20px;
      border: 3px solid var(--card-border);
      box-shadow: 0 4px 0 var(--card-border);
    }

    .resource-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--text-color);
    }

    .add-btn {
      background: var(--accent-green);
      color: white;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      border: 2px solid var(--card-border);
      font-weight: 700;
    }

    /* Left Side Missions Stack */
    .town-left-controls {
      position: absolute;
      top: 80px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 50;
    }

    .missions-btn {
      background-color: var(--accent-yellow);
      width: 58px;
      height: 58px;
      font-size: 26px;
      border-radius: 18px;
      position: relative;
    }

    .mission-badge-count {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--accent-red);
      color: white;
      font-size: 11px;
      font-weight: 900;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Enlarged Pedestrians - Always Top Z-Index */
    .pedestrian-wrapper {
      position: absolute;
      animation: walk 10s infinite alternate ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 3px 0 var(--card-border));
      z-index: 100 !important;
      cursor: pointer;
    }

    @keyframes walk {
      0% { transform: translateX(0px); }
      100% { transform: translateX(200px); }
    }

    .town-bottom-left { position: absolute; bottom: 20px; left: 20px; display: flex; gap: 15px; z-index: 50; }

    /* Interactive Facility Placement Container */
    .facility-node {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      cursor: pointer;
      transition: top 0.15s ease, left 0.15s ease;
    }

    .facility-label {
      font-size: 12px;
      font-weight: 800;
      margin-top: 2px;
      text-shadow: 1px 1px 0px var(--card-bg);
      pointer-events: none;
    }

    /* Directional Triangles for Facility Movement */
    .arrow-controls {
      position: absolute;
      top: -25px; left: -25px; right: -25px; bottom: -25px;
      pointer-events: none;
      display: none;
    }

    .arrow-controls.active {
      display: block;
    }

    .arrow-btn {
      position: absolute;
      width: 0;
      height: 0;
      pointer-events: auto;
      cursor: pointer;
      filter: drop-shadow(0 2px 0 var(--card-border));
      transition: transform 0.1s;
    }
    .arrow-btn:active {
      transform: scale(1.2);
    }

    /* Triangles pointing N, E, S, W */
    .arrow-north {
      top: -12px; left: 50%; transform: translateX(-50%);
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 16px solid var(--accent-yellow);
    }
    .arrow-south {
      bottom: -12px; left: 50%; transform: translateX(-50%);
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 16px solid var(--accent-yellow);
    }
    .arrow-east {
      right: -12px; top: 50%; transform: translateY(-50%);
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      border-left: 16px solid var(--accent-yellow);
    }
    .arrow-west {
      left: -12px; top: 50%; transform: translateY(-50%);
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      border-right: 16px solid var(--accent-yellow);
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-height: 300px;
      overflow-y: auto;
      padding: 5px;
    }

    .shop-item {
      background: var(--card-bg);
      border: 3px solid var(--card-border);
      border-radius: 16px;
      padding: 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      box-shadow: 0 3px 0 var(--card-border);
    }

    .tab-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab-btn {
      padding: 6px 12px;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 700;
      font-size: 13px;
      color: var(--text-color);
    }

    .tab-btn.active {
      background: var(--accent-yellow);
    }

    /* Starter Character Cards Grid */
    .character-selection-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-height: 320px;
      overflow-y: auto;
      padding: 4px;
    }

    .char-card {
      background: var(--card-bg);
      border: 3px solid var(--card-border);
      border-radius: 16px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--card-border);
      transition: transform 0.1s, background-color 0.2s;
    }

    .char-card:hover {
      transform: translateY(-2px);
      background: rgba(248, 192, 87, 0.2);
    }

    .char-card.selected {
      border-color: var(--accent-red);
      background: var(--accent-yellow);
    }

    /* Pure Outlined Vector Facilities */
    .outlined-art {
      filter: drop-shadow(0px 2px 0px var(--card-border));
      transition: transform 0.2s ease;
    }

    /* Construction Menu List Item with Checkbox Toggle */
    .construction-toggle-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .checkbox-box {
      width: 26px;
      height: 26px;
      border: 2px solid var(--card-border);
      border-radius: 6px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: var(--accent-green);
      font-size: 18px;
    }

    .checkbox-box.checked {
      background: #eafaf1;
    }

    /* Mission Item Component */
    .mission-item {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mission-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .mission-title {
      font-weight: 800;
      font-size: 0.9rem;
    }

    .mission-reward {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-green);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tos-text-box {
      max-height: 260px;
      overflow-y: auto;
      border: 2px solid var(--card-border);
      border-ra
